# Opt-in overlay: pass secrets as mounted files instead of environment
# variables, so they do not appear in `docker inspect` or `docker compose config`.
#
#   scripts/secrets-init.sh
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Add more entries here when you move Paystack, AWS or mail credentials out of
# the environment; the entrypoint accepts <VAR>_FILE for each of them.

services:
  backend:
    secrets:
      - app_key
      - db_password
    environment:
      APP_KEY_FILE: /run/secrets/app_key
      DB_PASSWORD_FILE: /run/secrets/db_password

  queue:
    secrets:
      - app_key
      - db_password
    environment:
      APP_KEY_FILE: /run/secrets/app_key
      DB_PASSWORD_FILE: /run/secrets/db_password

secrets:
  app_key:
    file: ./secrets/app_key
  db_password:
    file: ./secrets/db_password
