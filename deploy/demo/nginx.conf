# Demo gateway: serves the built React app and proxies the API on one origin,
# so a single tunnel URL is enough for people to explore RAMLP.
#
# Rendered by scripts/demo-tunnel.sh; __PLACEHOLDER__ values are substituted.

worker_processes 1;
pid __RUN_DIR__/nginx.pid;
error_log __RUN_DIR__/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include __MIME_TYPES__;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_max_body_size 20m;

    upstream api {
        server 127.0.0.1:__API_PORT__;
    }

    # Cloudflare terminates TLS and sends X-Forwarded-Proto: https; keep it so
    # Laravel generates https URLs. Direct local requests fall back to $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 127.0.0.1:__PORT__;
        server_name _;
        root __DIST__;
        index index.html;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;

        location /api/ {
            proxy_pass http://api;
        }

        location = /health {
            proxy_pass http://api/health;
        }

        location /storage/ {
            proxy_pass http://api;
        }

        location /sanctum/ {
            proxy_pass http://api;
        }

        # Single-page app: unknown paths fall back to index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
