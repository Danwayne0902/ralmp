          <SharedFooter />
        </div>
      );
    }

    // =========================================================================
    // MAIN APP COMPONENT WITH MEMORYROUTER
    // =========================================================================
    function App() {
      return (
        <MemoryRouter initialEntries={["/"]}>
          <Routes>
            <Route path="/" element={<LandingPage />} />
            <Route path="/auth" element={<AuthPage />} />
            <Route path="/farmer-sales" element={<FarmerSalesPage />} />
            <Route path="/farmer-orders" element={<FarmerOrdersPage />} />
            <Route path="/produce-history" element={<FarmerSalesPage />} />
            <Route path="/receipt-modal" element={<ReceiptModalPage />} />
            <Route path="/list-produce" element={<ListProducePage />} />
            <Route path="/marketplace" element={<MarketplacePage />} />
            <Route path="/batch-negotiation" element={<BatchNegotiationPage />} />
            <Route path="/escrow-checkout" element={<EscrowCheckoutPage />} />
            <Route path="/quality-lab" element={<QualityLabPage />} />
            <Route path="/lab-inspector" element={<QualityLabPage />} />
            <Route path="/haulage" element={<HaulagePage />} />
            <Route path="/carrier-dispatch" element={<HaulagePage />} />
            <Route path="/disputes" element={<DisputeReviewPage />} />
            <Route path="/settlements" element={<SettlementsPage />} />
          </Routes>
        </MemoryRouter>
      );
    }

    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
