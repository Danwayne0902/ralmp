name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, pdo_sqlite, sqlite3, mbstring, openssl, tokenizer, xml, ctype, json, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (SQLite in-memory)
        run: php artisan test

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend-react]
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  stack:
    name: Docker stack (nginx, Redis, queue)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the same image the compose file deploys. The registry cache keeps
      # the PHP extension build cheap on later runs.
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ramlp-backend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack
        # Email verification makes registration queue a real mail job.
        run: AUTH_EMAIL_VERIFICATION=true docker compose up -d --no-build mysql redis backend queue

      - name: Wait for the API
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "The API did not become healthy." >&2
          docker compose logs --no-color backend
          exit 1

      - name: Check nginx is serving the API
        run: |
          server=$(curl -fsSI http://127.0.0.1:8000/health | tr -d '\r' | awk 'tolower($1) == "server:" { print $2 }')
          echo "Server header: ${server:-<missing>}"
          case "$server" in
            nginx*) ;;
            *) echo "Expected nginx, not ${server:-<missing>}." >&2; exit 1 ;;
          esac

      - name: Check the web and queue containers share one APP_KEY
        run: |
          web_key=$(docker compose exec -T backend cat /app/.keys/app.key)
          queue_key=$(docker compose exec -T queue cat /app/.keys/app.key)
          if [ -z "$web_key" ] || [ "$web_key" != "$queue_key" ]; then
            echo "The web and queue containers do not share an APP_KEY." >&2
            exit 1
          fi
          echo "Both containers use the same generated APP_KEY."

      - name: Check the cache lives in Redis
        run: |
          curl -fsS http://127.0.0.1:8000/health > /dev/null
          key=$(docker compose exec -T redis redis-cli -n 1 --scan --pattern '*health:ping*' | head -n 1 | tr -d '\r')
          if [ -z "$key" ]; then
            echo "The health cache entry is not in Redis; the cache driver may still be file." >&2
            exit 1
          fi
          echo "Cache entry found in Redis: $key"

      - name: Prove the queue worker consumes a job
        run: |
          status=$(curl -sS -o /tmp/register.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/api/v1/auth/register \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -d '{
              "name": "CI Buyer",
              "email": "ci-buyer@example.test",
              "phone": "08000000001",
              "password": "password123",
              "password_confirmation": "password123",
              "role": "buyer",
              "address": "1 CI Street",
              "state": "Lagos",
              "lga": "Ikeja"
            }')

          cat /tmp/register.json
          echo

          if [ "$status" != "201" ]; then
            echo "Registration returned $status." >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if docker compose logs --no-color queue 2>&1 | grep -q 'ci-buyer@example.test'; then
              echo "The queue worker delivered the verification email."
              exit 0
            fi
            sleep 2
          done

          echo "The worker did not process the queued email." >&2
          docker compose logs --no-color backend queue
          exit 1

      - name: Prove a database backup restores
        env:
          ENV_FILE: /nonexistent
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: ramlp
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          scripts/db-backup.sh /tmp/ramlp-backups

          dump=$(ls /tmp/ramlp-backups/*.sql.gz | head -n 1)
          scripts/db-restore.sh "$dump" ramlp_restore_check --strict

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
