; Production php-fpm pool for the web container.
; Values can be raised per host once memory and CPU limits are known.
[www]
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

user = www-data
group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
